<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY 아젠다 보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 및 Babel 로드 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div style="padding: 20px; color: #4b5563; font-family: sans-serif;">
            <h2 id="msg">렌더링 초기화 중...</h2>
        </div>
    </div>

    <script type="text/babel">
        const msgEl = document.getElementById('msg');
        
        try {
            msgEl.innerText = "React 엔진을 구동합니다...";
            
            const App = () => (
                <div className="flex items-center justify-center h-screen bg-gray-100">
                    <div className="p-6 bg-white rounded-lg shadow-xl text-center">
                        <h1 className="text-2xl font-bold text-indigo-600 mb-2">GY 아젠다 보드 성공!</h1>
                        <p className="text-gray-500 text-sm">정상적으로 화면이 로드되었습니다.</p>
                    </div>
                </div>
            );

            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            
            msgEl.innerText = "화면을 그리는 중입니다...";
            root.render(<App />);
            msgEl.style.display = "none";
            
        } catch (err) {
            msgEl.innerHTML = `
                <div style="color: red; font-weight: bold;">
                    렌더링 오류 발생: ${err.message}
                </div>
            `;
            console.error(err);
        }
    </script>
</body>
</html>
