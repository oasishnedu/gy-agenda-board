<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원다모임</title>
    <!-- React, ReactDOM, Babel, Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        // Firebase는 전역으로 로드된 객체를 사용합니다. (모듈 import 대신 CDN 사용 권장)
        // 만약 외부 라이브러리 사용 시 아래와 같이 전역 객체로 접근하거나 스크립트 태그로 미리 로드해야 합니다.
        
        const { useState, useEffect, useRef } = React;

        function App() {
            const [title, setTitle] = useState("구영초 교직원다모임");

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <div className="bg-white p-8 rounded-xl shadow-lg w-full max-w-2xl">
                        <h1 className="text-3xl font-bold text-indigo-700 mb-4">{title}</h1>
                        <p className="text-slate-600">환영합니다! 이 페이지는 수정된 설정으로 정상 작동합니다.</p>
                        <button 
                            className="mt-6 bg-indigo-600 text-white px-6 py-2 rounded-lg hover:bg-indigo-700 transition"
                            onClick={() => alert("다모임 보드에 오신 것을 환영합니다!")}
                        >
                            시작하기
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
