<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-200">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
            authDomain: "gy-agenda-board.firebaseapp.com",
            projectId: "gy-agenda-board",
            storageBucket: "gy-agenda-board.firebasestorage.app",
            messagingSenderId: "636849502282",
            appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
            const [agendas, setAgendas] = React.useState([]);
            const [schedule, setSchedule] = React.useState({ title: '3월 구영초 교직원 다모임', date: '2026-03-26', location: '우다다책숲 도서관' });
            const [newAgenda, setNewAgenda] = React.useState({ title: '', description: '', author: '' });

            React.useEffect(() => {
                db.collection('agendas').onSnapshot(snap => setAgendas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                db.collection('schedule').doc('current').onSnapshot(snap => { if (snap.exists) setSchedule(snap.data()); });
            }, []);

            const addAgenda = (e) => {
                e.preventDefault();
                db.collection('agendas').add({ ...newAgenda, date: new Date().toLocaleDateString() });
                setNewAgenda({ title: '', description: '', author: '' });
            };

            const deleteAgenda = (id) => db.collection('agendas').doc(id).delete();

            return React.createElement('div', { className: 'min-h-screen bg-slate-200 p-4 flex justify-center' },
                React.createElement('div', { className: 'w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-300' },
                    React.createElement('h1', { className: 'text-2xl font-bold mb-6 text-indigo-600 text-center' }, '구영초 교직원 다모임'),
                    
                    React.createElement('div', { className: 'bg-indigo-600 text-white p-5 rounded-xl mb-6 shadow-md' },
                        React.createElement('h2', { className: 'font-bold text-lg' }, schedule.title),
                        React.createElement('p', { className: 'text-sm opacity-90' }, '일시: ' + schedule.date),
                        React.createElement('p', { className: 'text-sm opacity-90' }, '장소: ' + schedule.location)
                    ),

                    React.createElement('form', { onSubmit: addAgenda, className: 'bg-slate-50 p-4 rounded-lg mb-6 border border-slate-200' },
                        React.createElement('input', { placeholder: '등록자', className: 'block w-full border p-2 mb-2 rounded', value: newAgenda.author, onChange: (e) => setNewAgenda({...newAgenda, author: e.target.value}) }),
                        React.createElement('input', { placeholder: '안건 제목', className: 'block w-full border p-2 mb-2 rounded', value: newAgenda.title, onChange: (e) => setNewAgenda({...newAgenda, title: e.target.value}) }),
                        React.createElement('textarea', { placeholder: '상세 내용', className: 'block w-full border p-2 mb-2 rounded', value: newAgenda.description, onChange: (e) => setNewAgenda({...newAgenda, description: e.target.value}) }),
                        React.createElement('button', { className: 'bg-indigo-600 text-white p-2 w-full rounded font-bold' }, '안건 등록')
                    ),

                    React.createElement('div', { className: 'space-y-4' },
                        agendas.map(a => React.createElement('div', { key: a.id, className: 'bg-white p-4 rounded shadow border border-slate-200 hover:shadow-lg transition-shadow' },
                            React.createElement('div', { className: 'flex justify-between items-start' },
                                React.createElement('h3', { className: 'font-bold text-lg text-slate-800' }, a.title),
                                React.createElement('button', { onClick: () => deleteAgenda(a.id), className: 'text-red-400 hover:text-red-600 text-xs font-semibold' }, '삭제')
                            ),
                            React.createElement('p', { className: 'text-sm text-gray-600 mt-2 leading-relaxed' }, a.description),
                            React.createElement('div', { className: 'flex justify-between items-center mt-4 border-t pt-2' },
                                React.createElement('span', { className: 'text-xs text-indigo-500 font-bold' }, a.author),
                                React.createElement('span', { className: 'text-xs text-gray-400' }, a.date)
                            )
                        ))
                    )
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
