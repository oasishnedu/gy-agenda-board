<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
            authDomain: "gy-agenda-board.firebaseapp.com",
            projectId: "gy-agenda-board",
            storageBucket: "gy-agenda-board.firebasestorage.app",
            messagingSenderId: "636849502282",
            appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // 아이콘 SVG 컴포넌트들
        const Icon = ({ d, className }) => React.createElement('svg', { 
            className: className || 'w-5 h-5', 
            viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' 
        }, React.createElement('path', { d: d }));

        const { useState, useEffect } = React;

        function App() {
            const [agendas, setAgendas] = useState([]);
            const [schedule, setSchedule] = useState({ title: '3월 구영초 교직원 다모임', date: '2026-03-26T15:00', location: '우다다책숲 도서관' });

            useEffect(() => {
                const unsubAgendas = db.collection('agendas').onSnapshot(snap => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setAgendas(data.sort((a, b) => Number(b.id) - Number(a.id)));
                });
                const unsubSchedule = db.collection('schedule').doc('current').onSnapshot(snap => {
                    if (snap.exists) setSchedule(snap.data());
                });
                return () => { unsubAgendas(); unsubSchedule(); };
            }, []);

            return React.createElement('div', { className: 'min-h-screen bg-slate-200 p-4 flex justify-center items-start' },
                React.createElement('div', { className: 'w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-200' },
                    React.createElement('h1', { className: 'text-2xl font-bold text-indigo-600 mb-6 text-center flex items-center justify-center gap-2' }, 
                        React.createElement(Icon, { d: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' }), '구영초 교직원 다모임'),
                    
                    React.createElement('div', { className: 'bg-indigo-600 text-white p-5 rounded-xl mb-6 shadow-md' },
                        React.createElement('h2', { className: 'font-bold text-lg mb-1' }, schedule.title),
                        React.createElement('p', { className: 'text-sm opacity-90' }, '일시: ' + new Date(schedule.date).toLocaleDateString('ko-KR') + ' 15:00'),
                        React.createElement('p', { className: 'text-sm opacity-90' }, '장소: ' + schedule.location)
                    ),

                    React.createElement('h3', { className: 'font-bold text-gray-700 mb-3 border-b pb-2' }, '안건 목록 (' + agendas.length + '건)'),
                    React.createElement('div', { className: 'space-y-3' },
                        agendas.length === 0 
                            ? React.createElement('p', { className: 'text-center text-gray-400 py-4' }, '등록된 안건이 없습니다.')
                            : agendas.map(a => React.createElement('div', { key: a.id, className: 'bg-slate-50 p-4 rounded-lg border border-slate-200 shadow-sm' },
                                React.createElement('h4', { className: 'font-semibold text-gray-800' }, a.title),
                                React.createElement('p', { className: 'text-xs text-gray-500 mt-1' }, '작성자: ' + a.author)
                            ))
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
