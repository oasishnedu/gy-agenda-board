<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구영초 교직원다모임 보드</title>
  
  <!-- React & Babel & Tailwind CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 전체적인 텍스트 및 UI 크기를 1.2배(120%)로 키웁니다. */
    html { font-size: 120% !important; }
    
    /* 고정 픽셀(px)로 설정된 아주 작은 텍스트들만 비례하게 보정합니다. */
    .text-\[10px\] { font-size: 12px !important; }
    .text-\[8px\] { font-size: 9.6px !important; }
  </style>
</head>
<body class="bg-slate-200">
  <div id="root"></div>

  <!-- data-type="module" 을 추가하여 실시간 클라우드 모듈을 불러올 수 있게 합니다. -->
  <script type="text/babel" data-type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const { useState, useEffect } = React;

const firebaseConfig = {
  apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
  authDomain: "gy-agenda-board.firebaseapp.com",
  projectId: "gy-agenda-board",
  storageBucket: "gy-agenda-board.firebasestorage.app",
  messagingSenderId: "636849502282",
  appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
    };

    // --- 클라우드 데이터베이스 초기화 ---
    let app, auth, db;
    let appId = 'guyoung-agenda-board'; // 데이터 고유 보관함 이름

    try {
      if (myFirebaseConfig && myFirebaseConfig.apiKey) {
        // 선생님이 직접 입력한 설정으로 연결 (Vercel 용)
        app = initializeApp(myFirebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } else if (typeof __firebase_config !== 'undefined') {
        // 현재 화면(Canvas)용 자동 연결
        const firebaseConfig = JSON.parse(__firebase_config);
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        appId = typeof __app_id !== 'undefined' ? __app_id : appId;
      }
    } catch (e) {
      console.error("클라우드 연동을 초기화할 수 없습니다. 로컬 모드로 작동합니다.", e);
    }

    // --- 직접 그린 SVG 아이콘들 ---
    const Calendar = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
    const PlusCircle = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>;
    const List = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>;
    const User = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
    const Clock = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
    const MessageSquare = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>;
    const Edit2 = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>;
    const Save = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>;
    const XIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const Trash2 = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const Lock = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const FileText = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const ChevronDown = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    
    // 👥 회의 아이콘
    const MeetingIcon = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>
    );

    // --- 메인 앱 컴포넌트 ---
    function App() {
      // 권한 및 사용자 상태 관리
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState(false);

      // 클라우드 접속(Auth) 초기화
      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("인증 오류:", e);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      // 데이터 초기 기본값 (클라우드 미연결 시 로컬 모드로 작동)
      const defaultPastNotes = [{ id: "1", content: "2월 다모임 결과 공유 (25.02.20)\n\n1. 새학년 교육과정 준비 주간 일정 확정\n- 2/24(월): 학년별 협의회 및 교실 정비\n- 2/25(화): 전 교직원 워크숍\n\n2. 예산 사용 관련 안내\n- 학급 운영비 배분 기준 합의 완료" }];
      const defaultAgendas = [
        { id: "1", title: '3월 학급 자치활동 운영 예산 지원 건', description: '학년별 예산 배분 및 사용 기준, 정산 방법에 대해 논의하고자 합니다.', author: '박교사', date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now() + 1000 },
        { id: "2", title: '학생 생활지도 규정 개정 및 안전 교육', description: '쉬는 시간 스마트폰 사용 규정 및 등하교 교통안전 지도 방안에 대한 의견 수렴이 필요합니다.', author: '최부장', date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now() }
      ];
      const defaultSchedule = { title: '3월 구영초 교직원 다모임', date: '2026-03-26T15:00', location: '우다다책숲 도서관', note: '' };

      const [pastNotes, setPastNotes] = useState(db ? [] : defaultPastNotes);
      const [showPastNotesModal, setShowPastNotesModal] = useState(false);
      const [isEditingPastNotes, setIsEditingPastNotes] = useState(false);
      const [editPastNotesForm, setEditPastNotesForm] = useState([]);
      const [expandedNoteId, setExpandedNoteId] = useState(null);

      const [agendas, setAgendas] = useState(db ? [] : defaultAgendas);
      const [newAgenda, setNewAgenda] = useState({ title: '', description: '', author: '' });
      const [editingAgendaId, setEditingAgendaId] = useState(null);
      const [editAgendaForm, setEditAgendaForm] = useState({ title: '', description: '', author: '' });

      const [schedule, setSchedule] = useState(db ? {} : defaultSchedule);
      const [isEditingSchedule, setIsEditingSchedule] = useState(false);
      const [editScheduleForm, setEditScheduleForm] = useState(schedule);

      // 클라우드 실시간 동기화 리스너
      useEffect(() => {
        if (!user || !db) return;

        // 1. 안건 실시간 연동
        const agendasRef = collection(db, 'artifacts', appId, 'public', 'data', 'agendas');
        const unsubAgendas = onSnapshot(agendasRef, (snapshot) => {
          const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          data.sort((a, b) => b.createdAt - a.createdAt); // 최신순 정렬
          setAgendas(data);
        }, (err) => console.error(err));

        // 2. 일정 실시간 연동
        const scheduleRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedule');
        const unsubSchedule = onSnapshot(scheduleRef, (snapshot) => {
          const docSnap = snapshot.docs.find(d => d.id === 'current');
          if (docSnap) {
            setSchedule(docSnap.data());
          } else {
            // DB가 비어있으면 초기값 생성
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedule', 'current'), defaultSchedule);
          }
        }, (err) => console.error(err));

        // 3. 지난 회의록 실시간 연동
        const notesRef = collection(db, 'artifacts', appId, 'public', 'data', 'pastNotes');
        const unsubNotes = onSnapshot(notesRef, (snapshot) => {
          const docSnap = snapshot.docs.find(d => d.id === 'all');
          if (docSnap && docSnap.data().notes) {
            setPastNotes(docSnap.data().notes);
          } else {
            // DB가 비어있으면 초기값 생성
            setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pastNotes', 'all'), { notes: defaultPastNotes });
          }
        }, (err) => console.error(err));

        return () => { unsubAgendas(); unsubSchedule(); unsubNotes(); };
      }, [user]);

      // 날짜 포맷팅 관련 함수
      const formatDateTime = (dateStr) => {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
        const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? '오후' : '오전';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        return `${year}년 ${month}월 ${day}일 (${week}) ${ampm} ${hours}:${minutes}`;
      };

      const getDDay = (dateStr) => {
        if (!dateStr) return null;
        const targetDate = new Date(dateStr);
        if (isNaN(targetDate.getTime())) return null;
        const today = new Date();
        targetDate.setHours(0, 0, 0, 0); today.setHours(0, 0, 0, 0); 
        const diff = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day';
        if (diff > 0) return `D-${diff}`;
        return `D+${Math.abs(diff)}`;
      };
      const dDayString = getDDay(schedule.date);

      // 등록 마감 여부 계산
      const [currentTime, setCurrentTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 60000);
        return () => clearInterval(timer);
      }, []);
      const isRegistrationOpen = schedule.date && currentTime < new Date(schedule.date);

      // --- 핸들러 함수들 (클라우드/로컬 분기 처리) ---

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPassword === '3500') { 
          setIsAdmin(true); setShowAdminModal(false); setAdminPassword(''); setLoginError(false);
        } else {
          setLoginError(true);
        }
      };

      const handleOpenPastNotes = () => {
        setEditPastNotesForm([...pastNotes]);
        setIsEditingPastNotes(false);
        setShowPastNotesModal(true);
        if (pastNotes.length > 0) setExpandedNoteId(pastNotes[0].id);
      };

      const handleAddPastNote = () => setEditPastNotesForm([{ id: Date.now().toString(), content: '' }, ...editPastNotesForm]);
      const handleEditPastNoteChange = (id, newContent) => setEditPastNotesForm(editPastNotesForm.map(n => n.id === id ? { ...n, content: newContent } : n));
      const handleDeletePastNote = (id) => setEditPastNotesForm(editPastNotesForm.filter(n => n.id !== id));

      const handleSavePastNotes = async () => {
        const validNotes = editPastNotesForm.filter(n => n.content.trim() !== '');
        if (db) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pastNotes', 'all'), { notes: validNotes });
        } else {
          setPastNotes(validNotes);
        }
        setIsEditingPastNotes(false);
      };

      const handleEditScheduleClick = () => { setEditScheduleForm(schedule); setIsEditingSchedule(true); };
      const handleCancelScheduleClick = () => setIsEditingSchedule(false);

      const handleSaveScheduleClick = async () => {
        if (db) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedule', 'current'), editScheduleForm);
        } else {
          setSchedule(editScheduleForm);
        }
        setIsEditingSchedule(false);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!newAgenda.title.trim() || !newAgenda.author.trim()) return;
        const newId = Date.now().toString();
        const agendaItem = { id: newId, title: newAgenda.title, description: newAgenda.description, author: newAgenda.author, date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now() };

        if (db) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'agendas', newId), agendaItem);
        } else {
          setAgendas([agendaItem, ...agendas]);
        }
        setNewAgenda({ title: '', description: '', author: '' }); 
      };

      const handleEditAgendaClick = (agenda) => { setEditingAgendaId(agenda.id); setEditAgendaForm(agenda); };
      const handleCancelAgendaEdit = () => setEditingAgendaId(null);

      const handleSaveAgendaEdit = async () => {
        if (!editAgendaForm.title.trim() || !editAgendaForm.author.trim()) return;
        if (db) {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'agendas', editingAgendaId.toString()), editAgendaForm);
        } else {
          setAgendas(agendas.map(a => a.id === editingAgendaId ? editAgendaForm : a));
        }
        setEditingAgendaId(null);
      };

      const handleDeleteAgenda = async (id) => {
        if (db) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'agendas', id.toString()));
        } else {
          setAgendas(agendas.filter(a => a.id !== id));
        }
      };

      return (
        <div className="min-h-screen w-full flex flex-col justify-center items-center sm:py-6 lg:py-8 font-sans relative">
          
          {/* 관리자 로그인 모달 창 */}
          {showAdminModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center z-[60] p-4">
              <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl border border-slate-100 transform transition-all">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <Lock className="w-5 h-5 text-indigo-500" />
                    관리자 로그인
                  </h3>
                  <button onClick={() => { setShowAdminModal(false); setLoginError(false); setAdminPassword(''); }} className="text-slate-400 hover:text-slate-600">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>
                <p className="text-sm text-slate-500 mb-4">일정 수정 및 전체 안건 관리를 위해<br/>비밀번호를 입력해주세요.</p>
                <form onSubmit={handleAdminLoginSubmit}>
                  <input 
                    type="password" 
                    placeholder="비밀번호 입력 (초기값: 3500)"
                    className={`w-full px-3 py-2.5 text-sm sm:text-base border rounded-lg focus:outline-none focus:ring-2 mb-2 transition-colors ${loginError ? 'border-red-300 focus:ring-red-200' : 'border-slate-300 focus:ring-indigo-200'}`}
                    value={adminPassword}
                    onChange={(e) => { setAdminPassword(e.target.value); setLoginError(false); }}
                    autoFocus
                  />
                  {loginError && <p className="text-red-500 text-[10px] sm:text-xs mb-2 pl-1">비밀번호가 일치하지 않습니다.</p>}
                  <button type="submit" className="w-full mt-3 bg-indigo-600 text-white font-medium py-2.5 rounded-lg hover:bg-indigo-700 transition-colors shadow-sm">
                    확인
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* 지난 다모임 결과 확인/수정 모달 창 (목록형 아코디언) */}
          {showPastNotesModal && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center z-50 p-4">
              <div className="bg-white rounded-2xl p-5 sm:p-6 w-full max-w-2xl shadow-2xl border border-slate-100 flex flex-col max-h-[85vh]">
                <div className="flex justify-between items-center mb-4 flex-shrink-0">
                  <h3 className="text-lg sm:text-xl font-bold text-slate-800 flex items-center gap-2">
                    <FileText className="w-5 h-5 sm:w-6 sm:h-6 text-indigo-500" />
                    지난 다모임내용
                  </h3>
                  <button onClick={() => setShowPastNotesModal(false)} className="text-slate-400 hover:text-slate-600 p-1">
                    <XIcon className="w-5 h-5 sm:w-6 sm:h-6" />
                  </button>
                </div>
                
                <div className="flex-1 overflow-y-auto mb-4 bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 shadow-inner">
                  {isEditingPastNotes ? (
                    <div className="flex flex-col gap-3">
                      {editPastNotesForm.map((note) => (
                        <div key={note.id} className="relative group bg-white rounded-md border border-indigo-200 overflow-hidden shadow-sm">
                          <textarea
                            className="w-full min-h-[120px] p-3 pr-10 bg-transparent focus:outline-none text-sm sm:text-base resize-none"
                            value={note.content}
                            onChange={(e) => handleEditPastNoteChange(note.id, e.target.value)}
                            placeholder="첫 줄에 제목을 입력하세요. (엔터 후 내용 작성)"
                          />
                          <button
                            onClick={() => handleDeletePastNote(note.id)}
                            className="absolute top-2 right-2 p-1.5 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-md transition-colors"
                            title="이 회의록 삭제"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>
                      ))}
                      <button
                        onClick={handleAddPastNote}
                        className="w-full py-3 border-2 border-dashed border-indigo-200 text-indigo-500 rounded-md hover:bg-indigo-50 hover:border-indigo-300 transition-colors flex items-center justify-center gap-1.5 font-medium text-sm sm:text-base mt-2"
                      >
                        <PlusCircle className="w-4 h-4" />새 회의록 추가
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-2.5">
                      {pastNotes.length === 0 ? (
                        <p className="text-center text-slate-400 py-10 text-sm sm:text-base">등록된 지난 다모임 내용이 없습니다.</p>
                      ) : (
                        pastNotes.map(note => {
                          const lines = note.content.trim().split('\n');
                          const title = lines[0] || '(제목 없음)';
                          const body = lines.slice(1).join('\n').trim();
                          const isExpanded = expandedNoteId === note.id;

                          return (
                            <div key={note.id} className="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                              <button
                                onClick={() => setExpandedNoteId(isExpanded ? null : note.id)}
                                className="w-full text-left px-4 py-3.5 hover:bg-slate-50 flex justify-between items-center transition-colors focus:outline-none"
                              >
                                <span className="font-bold text-slate-800 text-sm sm:text-base truncate pr-4">{title}</span>
                                <ChevronDown className={`w-5 h-5 text-slate-400 flex-shrink-0 transform transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}`} />
                              </button>
                              {isExpanded && body && (
                                <div className="px-4 py-3.5 border-t border-slate-100 text-sm sm:text-base text-slate-600 whitespace-pre-wrap leading-relaxed bg-slate-50/50">
                                  {body}
                                </div>
                              )}
                            </div>
                          );
                        })
                      )}
                    </div>
                  )}
                </div>

                {isAdmin && (
                  <div className="flex justify-end gap-2 flex-shrink-0 pt-2 border-t border-slate-100">
                    {isEditingPastNotes ? (
                      <>
                        <button onClick={() => setIsEditingPastNotes(false)} className="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 transition-colors text-xs sm:text-sm font-medium">
                          취소
                        </button>
                        <button onClick={handleSavePastNotes} className="flex items-center gap-1.5 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-xs sm:text-sm font-medium">
                          <Save className="w-4 h-4"/> 
                          내용 저장
                        </button>
                      </>
                    ) : (
                      <button onClick={() => setIsEditingPastNotes(true)} className="flex items-center gap-1.5 px-4 py-2 bg-indigo-100 text-indigo-700 rounded-lg hover:bg-indigo-200 transition-colors text-xs sm:text-sm font-medium">
                        <Edit2 className="w-4 h-4"/> 
                        관리자 수정
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          <div className="w-full max-w-5xl h-screen sm:h-[90vh] flex flex-col bg-slate-50 text-slate-800 sm:rounded-3xl shadow-2xl overflow-hidden border-0 sm:border border-slate-300 transition-all duration-300">
            
            <header className="bg-white shadow-sm px-4 sm:px-6 py-3 sm:py-4 flex-shrink-0 z-10 border-b border-slate-100">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 sm:gap-3">
                  <MeetingIcon className="w-6 h-6 sm:w-7 sm:h-7 text-indigo-500 flex-shrink-0" />
                  <div className="flex flex-col">
                    <h1 className="text-lg sm:text-xl font-bold text-indigo-700 leading-tight">
                      구영초 교직원다모임
                    </h1>
                    <p className="text-[10px] sm:text-xs text-slate-500 font-medium mt-0.5 tracking-wide">
                      우리 학교의 내일을 함께 그리는 공간
                    </p>
                  </div>
                </div>
                
                <div className="flex flex-col items-end gap-1.5 sm:gap-2">
                  <div className="text-[10px] sm:text-xs text-slate-400 bg-slate-100 px-2 sm:px-2.5 py-1 rounded-full whitespace-nowrap">
                    협업 보드 {isAdmin && <span className="ml-1 text-indigo-500 font-bold">(관리자)</span>}
                  </div>
                  {/* 지난 다모임 버튼이 헤더 우측으로 이동 및 스타일 변경 */}
                  <button onClick={handleOpenPastNotes} className="flex items-center gap-1 text-[10px] sm:text-xs text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2 sm:px-2.5 py-1 sm:py-1.5 rounded-full transition-colors cursor-pointer border border-indigo-100 shadow-sm" title="지난 다모임 결과 팝업 보기">
                    <FileText className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                    지난 다모임
                  </button>
                </div>

              </div>
            </header>

            <main className="flex-1 lg:overflow-hidden overflow-y-auto p-4 sm:p-6 flex flex-col lg:flex-row gap-4 sm:gap-6">
              
              <div className="w-full lg:w-[40%] flex flex-col gap-4 sm:gap-5 flex-shrink-0 lg:overflow-y-auto lg:pr-2 pb-2">
                
                <section className="bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl sm:rounded-2xl shadow-md p-3.5 sm:p-4 text-white flex-shrink-0 relative group">
                  {isEditingSchedule && isAdmin ? (
                    <div className="flex flex-col gap-2">
                      <div className="flex items-center justify-between border-b border-indigo-400 pb-2 mb-1">
                        <h2 className="text-base font-bold flex items-center gap-1.5">
                          <Calendar className="w-4 h-4" />
                          일정 수정
                        </h2>
                        <div className="flex gap-1.5">
                          <button onClick={handleCancelScheduleClick} className="p-1.5 bg-white/20 hover:bg-white/30 rounded-md transition-colors" title="취소">
                            <XIcon className="w-4 h-4 text-white" />
                          </button>
                          <button onClick={handleSaveScheduleClick} className="flex items-center gap-1 px-3 py-1.5 bg-white text-indigo-600 font-bold rounded-md hover:bg-indigo-50 transition-colors text-xs sm:text-sm" title="저장">
                            <Save className="w-3.5 h-3.5" />
                            저장
                          </button>
                        </div>
                      </div>
                      <div className="flex flex-col gap-3">
                        <div>
                          <label className="block text-indigo-100 text-xs sm:text-sm mb-1.5">일시</label>
                          <input 
                            type="datetime-local" 
                            value={editScheduleForm.date} 
                            onChange={(e) => setEditScheduleForm({...editScheduleForm, date: e.target.value})} 
                            className="w-full px-3 py-2 text-sm sm:text-base bg-white text-slate-800 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-300" 
                          />
                        </div>
                        <div>
                          <label className="block text-indigo-100 text-xs sm:text-sm mb-1.5">장소</label>
                          <input type="text" value={editScheduleForm.location} onChange={(e) => setEditScheduleForm({...editScheduleForm, location: e.target.value})} className="w-full px-3 py-2 text-sm sm:text-base bg-white text-slate-800 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-300" />
                        </div>
                        <div>
                          <label className="block text-indigo-100 text-xs sm:text-sm mb-1.5">참고사항 (선택)</label>
                          <input type="text" value={editScheduleForm.note} onChange={(e) => setEditScheduleForm({...editScheduleForm, note: e.target.value})} placeholder="예: 개인 텀블러 지참" className="w-full px-3 py-2 text-sm sm:text-base bg-white text-slate-800 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-300" />
                        </div>
                      </div>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div className="flex justify-between items-start">
                        <div className="flex items-center gap-2.5">
                          <div className="bg-white/20 p-2 sm:p-2.5 rounded-full flex-shrink-0">
                            <Calendar className="w-5 h-5 sm:w-6 sm:h-6 text-white" />
                          </div>
                          <h2 className="text-xs sm:text-sm font-medium text-indigo-100 uppercase tracking-wider">
                            다음 다모임 일정
                          </h2>
                        </div>
                        
                        {/* 관리자에게만 일정 수정 버튼 표시 */}
                        {isAdmin && (
                          <div className="flex items-center justify-end mt-2 sm:mt-0">
                            <button onClick={handleEditScheduleClick} className="opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-1 text-[10px] sm:text-xs bg-white/20 hover:bg-white/30 px-2 py-1.5 rounded text-white cursor-pointer" title="일정 수정">
                              <Edit2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                              수정
                            </button>
                          </div>
                        )}
                      </div>
                      <div>
                        <div className="flex flex-col gap-1 mt-1">
                          <div className="flex items-start sm:items-center gap-1.5 text-base sm:text-lg font-bold">
                            <Clock className="w-5 h-5 flex-shrink-0 text-indigo-200 mt-0.5 sm:mt-0" />
                            <span className="break-keep leading-tight">{formatDateTime(schedule.date)}</span>
                            {dDayString && (
                              <span className="ml-1 bg-pink-500 text-white text-xs sm:text-sm font-extrabold px-2 py-0.5 rounded-full shadow-sm flex-shrink-0 whitespace-nowrap">
                                {dDayString}
                              </span>
                            )}
                          </div>
                          <div className="flex items-start gap-1.5 text-indigo-100 text-base sm:text-lg">
                            <User className="w-5 h-5 flex-shrink-0 mt-0.5" />
                            <span className="break-keep leading-tight">{schedule.location}</span>
                          </div>
                          {schedule.note && (
                            <div className="flex items-start gap-1.5 text-indigo-100 text-base sm:text-lg">
                              <FileText className="w-5 h-5 flex-shrink-0 mt-0.5" />
                              <span className="break-keep leading-tight">{schedule.note}</span>
                            </div>
                          )}
                        </div>
                      </div>
                    </div>
                  )}
                </section>

                <section className="bg-white rounded-xl sm:rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-shrink-0 relative overflow-hidden">
                  <div className="p-3 sm:p-4 border-b border-slate-100 flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <PlusCircle className="w-4 h-4 sm:w-5 sm:h-5 text-indigo-500" />
                      <h2 className="text-sm sm:text-base font-bold">새 안건 등록</h2>
                    </div>
                    {!isRegistrationOpen && (
                      <span className="bg-red-100 text-red-600 text-[10px] sm:text-xs font-bold px-2 sm:px-2.5 py-0.5 sm:py-1 rounded-full flex items-center gap-1">
                        <Lock className="w-3 h-3" /> 마감됨
                      </span>
                    )}
                  </div>
                  
                  {isRegistrationOpen ? (
                    <form onSubmit={handleSubmit} className="p-3 sm:p-4 flex flex-col gap-3">
                      <div className="flex gap-2 sm:gap-3">
                        <input type="text" placeholder="등록자(부서명) *" className="w-1/3 px-3 py-2 sm:py-2.5 text-sm sm:text-base rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newAgenda.author} onChange={(e) => setNewAgenda({...newAgenda, author: e.target.value})} required />
                        <input type="text" placeholder="안건 제목 *" className="w-2/3 px-3 py-2 sm:py-2.5 text-sm sm:text-base rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" value={newAgenda.title} onChange={(e) => setNewAgenda({...newAgenda, title: e.target.value})} required />
                      </div>
                      <textarea placeholder="상세 내용 (선택)" className="w-full min-h-[80px] sm:min-h-[100px] px-3 py-2 sm:py-2.5 text-sm sm:text-base rounded-md border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none" value={newAgenda.description} onChange={(e) => setNewAgenda({...newAgenda, description: e.target.value})}></textarea>
                      <button type="submit" className="w-full mt-1 sm:mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 sm:py-3 rounded-md transition-colors flex items-center justify-center gap-1.5 text-sm sm:text-base shadow-sm">
                        <PlusCircle className="w-4 h-4 sm:w-5 sm:h-5" />
                        추가하기
                      </button>
                    </form>
                  ) : (
                    <div className="p-8 flex flex-col items-center justify-center text-slate-400 bg-slate-50/50">
                      <Lock className="w-10 h-10 mb-3 opacity-30" />
                      <p className="text-sm sm:text-base font-medium text-slate-600">안건 등록이 마감되었습니다.</p>
                      <p className="text-xs sm:text-sm mt-1 text-center">다음 일정이 새로 설정되면<br/>다시 오픈됩니다.</p>
                    </div>
                  )}
                </section>
              </div>

              <section className="w-full lg:w-[60%] bg-white rounded-xl sm:rounded-2xl shadow-sm border border-slate-200 flex flex-col flex-shrink-0 lg:h-full lg:overflow-hidden">
                <div className="p-2.5 sm:p-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/50 flex-shrink-0">
                  <div className="flex items-center gap-1.5 sm:gap-2">
                    <List className="w-3.5 h-3.5 sm:w-4 sm:h-4 text-indigo-500" />
                    <h2 className="text-xs sm:text-sm font-bold">등록된 안건 목록</h2>
                  </div>
                  <span className="bg-indigo-100 text-indigo-700 text-[8px] sm:text-[10px] font-bold px-1.5 sm:px-2 py-0.5 rounded-full">
                    총 {agendas.length}건
                  </span>
                </div>
                
                <div className="p-2.5 sm:p-3 flex flex-col gap-2.5 sm:gap-3 lg:flex-1 lg:overflow-y-auto bg-slate-50/30">
                  {agendas.length === 0 ? (
                    <div className="py-6 sm:py-8 flex flex-col items-center justify-center text-slate-400 gap-1.5 sm:gap-2">
                      <MessageSquare className="w-8 h-8 opacity-20" />
                      <p className="text-[10px] sm:text-xs text-center">아직 등록된 안건이 없습니다.<br/>첫 번째 안건을 등록해 보세요!</p>
                    </div>
                  ) : (
                    agendas.map((agenda) => (
                      editingAgendaId === agenda.id ? (
                        <div key={`edit-${agenda.id}`} className="bg-indigo-50/50 p-2.5 sm:p-3 rounded-lg border border-indigo-200 flex flex-col gap-2">
                          <div className="flex items-center justify-between mb-0.5">
                            <h3 className="text-[10px] sm:text-xs font-bold text-indigo-700 flex items-center gap-1">
                              <Edit2 className="w-3 h-3"/> 안건 수정 중
                            </h3>
                            <button onClick={handleCancelAgendaEdit} className="p-1 text-slate-500 hover:bg-slate-200 rounded-md transition-colors">
                              <XIcon className="w-3 h-3" />
                            </button>
                          </div>
                          <input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.author} onChange={(e) => setEditAgendaForm({...editAgendaForm, author: e.target.value})} placeholder="등록자" />
                          <input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.title} onChange={(e) => setEditAgendaForm({...editAgendaForm, title: e.target.value})} placeholder="안건 제목" />
                          <textarea className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm resize-none min-h-[60px] focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.description} onChange={(e) => setEditAgendaForm({...editAgendaForm, description: e.target.value})} placeholder="상세 내용"></textarea>
                          <div className="flex justify-end mt-1">
                            <button onClick={handleSaveAgendaEdit} className="flex items-center gap-1 px-2.5 sm:px-3 py-1 sm:py-1.5 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 transition-colors text-[10px] sm:text-xs">
                              <Save className="w-3 h-3" />
                              저장완료
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div key={agenda.id} className="bg-white p-2.5 sm:p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow group relative">
                          <div className="flex justify-between items-start mb-1 pr-14 sm:pr-16">
                            <h3 className="text-xs sm:text-sm font-bold text-slate-800 leading-tight">
                              {agenda.title}
                            </h3>
                          </div>
                          
                          {/* 등록 기간 중에는 모든 사용자가, 마감 후에는 관리자만 수정/삭제 가능 */}
                          <div className="absolute top-2.5 right-2.5 flex flex-col items-end gap-0.5 sm:gap-1">
                            {(isRegistrationOpen || isAdmin) && (
                              <div className="opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex gap-0.5 bg-white/90 rounded px-1 pb-1">
                                <button onClick={() => handleEditAgendaClick(agenda)} className="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded" title="수정">
                                  <Edit2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                                </button>
                                <button onClick={() => handleDeleteAgenda(agenda.id)} className="p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded" title="삭제">
                                  <Trash2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
                                </button>
                              </div>
                            )}
                          </div>
                          
                          {agenda.description && (
                            <p className="text-slate-600 text-[10px] sm:text-xs mt-1.5 mb-2 whitespace-pre-wrap leading-relaxed">
                              {agenda.description}
                            </p>
                          )}
                          
                          <div className="flex items-center gap-1 sm:gap-1.5 mt-2 pt-2 border-t border-slate-50">
                            <div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
                              <User className="w-2.5 h-2.5 sm:w-3 sm:h-3" />
                            </div>
                            <span className="text-[10px] sm:text-xs font-medium text-slate-700">{agenda.author}</span>
                          </div>
                        </div>
                      )
                    ))
                  )}
                </div>
              </section>

            </main>

            {/* 하단 저작권 및 관리자 메뉴 버튼 */}
            <footer className="py-2.5 sm:py-3 bg-slate-100 border-t border-slate-200 flex justify-center items-center flex-shrink-0 z-10 relative">
              <span className="text-[10px] sm:text-xs text-slate-400 font-medium tracking-wide">
                &copy; 2026 GUYOUNG ELEMENTARY SCHOOL
              </span>
              
              {!isAdmin ? (
                <button onClick={() => setShowAdminModal(true)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-slate-300 hover:text-indigo-400 font-medium transition-colors">
                  관리자
                </button>
              ) : (
                <button onClick={() => setIsAdmin(false)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-indigo-500 hover:text-indigo-700 font-bold transition-colors">
                  모드 종료
                </button>
              )}
            </footer>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
