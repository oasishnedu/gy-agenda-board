<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
            authDomain: "gy-agenda-board.firebaseapp.com",
            projectId: "gy-agenda-board",
            storageBucket: "gy-agenda-board.firebasestorage.app",
            messagingSenderId: "636849502282",
            appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // SVG 아이콘 컴포넌트들
        const Icon = ({ d, className = 'w-4 h-4' }) => React.createElement('svg', { 
            className: className, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: '2', strokeLinecap: 'round', strokeLinejoin: 'round' 
        }, React.createElement('path', { d: d }));

        const { useState, useEffect } = React;

        function App() {
            const [agendas, setAgendas] = useState([]);
            const [schedule, setSchedule] = useState({ title: '3월 구영초 교직원 다모임', date: '2026-03-26T15:00', location: '우다다책숲 도서관' });

            useEffect(() => {
                const unsubAgendas = db.collection('agendas').onSnapshot(snap => {
                    const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    setAgendas(data.sort((a, b) => Number(b.id) - Number(a.id)));
                });
                const unsubSchedule = db.collection('schedule').doc('current').onSnapshot(snap => {
                    if (snap.exists) setSchedule(snap.data());
                });
                return () => { unsubAgendas(); unsubSchedule(); };
            }, []);

            return React.createElement('div', { className: 'min-h-screen bg-slate-200 p-4 flex justify-center' },
                React.createElement('div', { className: 'w-full max-w-md bg-white rounded-2xl shadow-xl p-6 border border-slate-300' },
                    React.createElement('header', { className: 'mb-6 border-b pb-4 text-center' },
                        React.createElement('h1', { className: 'text-xl font-black text-indigo-600 flex items-center justify-center gap-2' }, 
                            React.createElement(Icon, { d: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2', className: 'w-7 h-7' }), '구영초 교직원 다모임')
                    ),
                    
                    React.createElement('div', { className: 'bg-indigo-600 text-white p-5 rounded-xl mb-6 shadow-lg' },
                        React.createElement('h2', { className: 'font-bold text-lg mb-2' }, schedule.title),
                        React.createElement('div', { className: 'flex items-center gap-2 text-sm opacity-90' }, React.createElement(Icon, { d: 'M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2' }), '일시: ' + new Date(schedule.date).toLocaleDateString('ko-KR')),
                        React.createElement('div', { className: 'flex items-center gap-2 text-sm opacity-90 mt-1' }, React.createElement(Icon, { d: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z' }), '장소: ' + schedule.location)
                    ),

                    React.createElement('h3', { className: 'font-bold text-gray-800 mb-4 pb-2 border-b-2 flex items-center gap-2' }, 
                        React.createElement(Icon, { d: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01' }), '안건 목록'),
                    
                    React.createElement('div', { className: 'space-y-4' },
                        agendas.length === 0 
                            ? React.createElement('p', { className: 'text-center text-gray-400 py-4' }, '등록된 안건이 없습니다.')
                            : agendas.map(a => React.createElement('div', { key: a.id, className: 'bg-white border-l-4 border-indigo-500 shadow-sm p-4 rounded-r-lg border-t border-r border-b' },
                                React.createElement('h4', { className: 'font-bold text-gray-900' }, a.title),
                                a.description && React.createElement('p', { className: 'text-sm text-gray-600 mt-1' }, a.description),
                                React.createElement('div', { className: 'flex justify-between items-center mt-3' },
                                    React.createElement('span', { className: 'text-xs text-indigo-500 font-bold' }, a.author),
                                    React.createElement('div', { className: 'flex gap-2' },
                                        React.createElement('button', { className: 'text-gray-400 hover:text-indigo-600' }, '수정'),
                                        React.createElement('button', { className: 'text-gray-400 hover:text-red-600' }, '삭제')
                                    )
                                )
                            ))
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
