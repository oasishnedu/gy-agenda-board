<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const firebaseConfig = {
            apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
            authDomain: "gy-agenda-board.firebaseapp.com",
            projectId: "gy-agenda-board",
            storageBucket: "gy-agenda-board.firebasestorage.app",
            messagingSenderId: "636849502282",
            appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const { useState, useEffect } = React;

        function App() {
            const [agendas, setAgendas] = useState([]);
            const [schedule, setSchedule] = useState({ title: '3월 구영초 교직원 다모임', date: '2026-03-26T15:00', location: '우다다책숲 도서관' });
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // 실시간 데이터 로딩
                const unsubAgendas = db.collection('agendas').onSnapshot(
                    (snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setAgendas(data.sort((a, b) => Number(b.id) - Number(a.id)));
                        setLoading(false);
                    },
                    (err) => {
                        console.error("데이터 로드 오류:", err);
                        setLoading(false); // 오류 발생 시에도 로딩 중지
                    }
                );
                
                const unsubSchedule = db.collection('schedule').doc('current').onSnapshot(
                    (snap) => {
                        if (snap.exists) setSchedule(snap.data());
                    }
                );
                return () => { unsubAgendas(); unsubSchedule(); };
            }, []);

            if (loading) {
                return <div className="min-h-screen flex items-center justify-center text-gray-500">데이터를 불러오는 중입니다...</div>;
            }

            return (
                <div className="min-h-screen bg-slate-200 p-4 flex justify-center">
                    <div className="w-full max-w-md bg-white rounded-2xl shadow-xl p-6">
                        <h1 className="text-xl font-bold text-indigo-600 mb-4">구영초 교직원 다모임</h1>
                        <div className="bg-indigo-500 text-white p-4 rounded-lg mb-6">
                            <p className="font-bold text-sm">일정: {new Date(schedule.date).toLocaleDateString('ko-KR')}</p>
                            <p className="text-xs">{schedule.location}</p>
                        </div>
                        <div className="space-y-3">
                            {agendas.length === 0 ? <p className="text-center text-gray-400">등록된 안건이 없습니다.</p> : agendas.map(a => (
                                <div key={a.id} className="border-b pb-2">
                                    <h3 className="font-bold text-sm">{a.title}</h3>
                                    <p className="text-xs text-gray-500">{a.author}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
