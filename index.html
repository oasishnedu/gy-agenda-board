<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-200">
    <div id="root"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
            authDomain: "gy-agenda-board.firebaseapp.com",
            projectId: "gy-agenda-board",
            storageBucket: "gy-agenda-board.firebasestorage.app",
            messagingSenderId: "636849502282",
            appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function App() {
            const [agendas, setAgendas] = React.useState([]);
            const [schedule, setSchedule] = React.useState({ title: '', date: '', location: '' });
            const [newAgenda, setNewAgenda] = React.useState({ title: '', description: '', author: '' });

            React.useEffect(() => {
                db.collection('agendas').onSnapshot(snap => setAgendas(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
                db.collection('schedule').doc('current').onSnapshot(snap => { if (snap.exists) setSchedule(snap.data()); });
            }, []);

            const addAgenda = (e) => {
                e.preventDefault();
                db.collection('agendas').add({ ...newAgenda, timestamp: Date.now() });
                setNewAgenda({ title: '', description: '', author: '' });
            };

            const deleteAgenda = (id) => db.collection('agendas').doc(id).delete();

            return React.createElement('div', { className: 'p-6 max-w-lg mx-auto' },
                React.createElement('h1', { className: 'text-2xl font-bold mb-4' }, '구영초 교직원 다모임'),
                
                // 관리자 일정 설정 (기존 UI 복구)
                React.createElement('div', { className: 'bg-indigo-600 text-white p-4 rounded-lg mb-4' },
                    React.createElement('h2', { className: 'font-bold' }, schedule.title || '일정을 설정하세요'),
                    React.createElement('p', null, schedule.date, ' / ', schedule.location)
                ),

                // 안건 등록 폼
                React.createElement('form', { onSubmit: addAgenda, className: 'bg-white p-4 rounded shadow mb-4' },
                    React.createElement('input', { placeholder: '등록자', className: 'block w-full border p-2 mb-2', value: newAgenda.author, onChange: (e) => setNewAgenda({...newAgenda, author: e.target.value}) }),
                    React.createElement('input', { placeholder: '안건 제목', className: 'block w-full border p-2 mb-2', value: newAgenda.title, onChange: (e) => setNewAgenda({...newAgenda, title: e.target.value}) }),
                    React.createElement('button', { className: 'bg-blue-500 text-white p-2 w-full' }, '안건 등록')
                ),

                // 안건 리스트
                React.createElement('div', { className: 'space-y-2' },
                    agendas.map(a => React.createElement('div', { key: a.id, className: 'bg-white p-4 rounded flex justify-between shadow' },
                        React.createElement('div', null, React.createElement('h3', { className: 'font-bold' }, a.title), React.createElement('p', { className: 'text-sm' }, a.author)),
                        React.createElement('button', { onClick: () => deleteAgenda(a.id), className: 'text-red-500' }, '삭제')
                    ))
                )
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
