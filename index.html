<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>구영초 교직원다모임</title>
<!-- React 전역 로드 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel 및 Tailwind -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase 호환성 라이브러리 전역 로드 -->
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
<style>
html { font-size: 120% !important; }
[contenteditable]:empty:before { content: attr(placeholder); color: #94a3b8; pointer-events: none; display: block; }
</style>
</head>
<body class="bg-slate-200">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

const myFirebaseConfig = {
    apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
    authDomain: "gy-agenda-board.firebaseapp.com",
    projectId: "gy-agenda-board",
    storageBucket: "gy-agenda-board.firebasestorage.app",
    messagingSenderId: "636849502282",
    appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
};

// Firebase 초기화
if (!firebase.apps.length) {
    firebase.initializeApp(myFirebaseConfig);
}
const auth = firebase.auth();
const db = firebase.firestore();
const appId = 'guyoung-agenda-board';

const RichEditor = ({ initialValue, onHTMLChange }) => {
    const editorRef = useRef(null);
    useEffect(() => { if (editorRef.current && editorRef.current.innerHTML !== initialValue) editorRef.current.innerHTML = initialValue || ''; }, [initialValue]);
    const execCmd = (cmd, val = null) => { document.execCommand(cmd, false, val); onHTMLChange(editorRef.current.innerHTML); };
    return (
        <div className="flex flex-col border border-indigo-100 bg-white rounded-md overflow-hidden">
            <div className="flex flex-wrap gap-1 p-2 bg-slate-50 border-b">
                <button type="button" onClick={() => execCmd('bold')} className="px-2 font-bold">B</button>
                <button type="button" onClick={() => execCmd('italic')} className="px-2 italic">I</button>
            </div>
            <div ref={editorRef} contentEditable onInput={(e) => onHTMLChange(e.currentTarget.innerHTML)} className="p-3 min-h-[100px] outline-none text-sm" />
        </div>
    );
};

function App() {
    const [user, setUser] = useState(null);
    const [pastNotes, setPastNotes] = useState([]);
    const [editPastNotesForm, setEditPastNotesForm] = useState([]);
    const [showPastNotesModal, setShowPastNotesModal] = useState(false);

    useEffect(() => {
        auth.signInAnonymously().catch(console.error);
        const unsubAuth = auth.onAuthStateChanged(setUser);
        
        const unsubNotes = db.doc(`artifacts/${appId}/public/data/pastNotes/all`)
            .onSnapshot((docSnap) => {
                if (docSnap.exists) setPastNotes(docSnap.data().notes || []);
            });

        return () => { unsubAuth(); unsubNotes(); };
    }, []);

    const handleAddPastNote = () => setEditPastNotesForm([{ id: Date.now().toString(), title: '', content: '', isHtml: true }, ...editPastNotesForm]);
    const handleEditPastNoteChange = (id, field, value) => setEditPastNotesForm(editPastNotesForm.map(n => n.id === id ? {...n, [field]: value} : n));
    const handleDeletePastNote = (id) => setEditPastNotesForm(editPastNotesForm.filter(n => n.id !== id));

    const handleSavePastNotes = async () => {
        try {
            await db.doc(`artifacts/${appId}/public/data/pastNotes/all`).set({ notes: editPastNotesForm });
            setShowPastNotesModal(false);
        } catch (e) { console.error("저장 실패", e); }
    };

    return (
        <div className="p-4">
            <h1 className="text-2xl font-bold text-center text-indigo-700 mb-6">구영초 교직원다모임</h1>
            <div className="flex justify-center">
                <button onClick={() => { setEditPastNotesForm(pastNotes); setShowPastNotesModal(true); }} className="bg-indigo-600 text-white px-4 py-2 rounded shadow">지난 회의록 보기</button>
            </div>
            
            {showPastNotesModal && (
                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                    <div className="bg-white p-6 rounded-lg w-full max-w-lg max-h-[80vh] overflow-y-auto">
                        <h2 className="text-lg font-bold mb-4">회의록 관리</h2>
                        {editPastNotesForm.map(note => (
                            <div key={note.id} className="mb-4 border p-2 rounded">
                                <input value={note.title} onChange={(e) => handleEditPastNoteChange(note.id, 'title', e.target.value)} placeholder="제목" className="w-full mb-2 border-b p-1" />
                                <RichEditor initialValue={note.content} onHTMLChange={(html) => handleEditPastNoteChange(note.id, 'content', html)} />
                                <button onClick={() => handleDeletePastNote(note.id)} className="text-red-500 text-sm mt-2">삭제</button>
                            </div>
                        ))}
                        <button onClick={handleAddPastNote} className="bg-green-500 text-white px-3 py-1 rounded text-sm mb-4">+ 추가</button>
                        <div className="flex gap-2">
                            <button onClick={handleSavePastNotes} className="bg-blue-600 text-white px-4 py-2 rounded">저장</button>
                            <button onClick={() => setShowPastNotesModal(false)} className="bg-slate-300 px-4 py-2 rounded">닫기</button>
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
