<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GY 아젠다 보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React 및 의존성 라이브러리 로드 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        #root { width: 100%; height: 100vh; }
        .error-boundary { padding: 20px; color: red; font-family: monospace; }
    </style>
</head>
<body>
    <div id="root">
        <div class="error-boundary">로딩 중... 만약 여기서 멈춘다면 설정된 스크립트가 차단된 것입니다.</div>
    </div>

    <script type="text/babel">
        // 최상위 에러 핸들러
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('root').innerHTML = `
                <div class="error-boundary">
                    <h2>치명적 오류 발생</h2>
                    <p>메시지: ${message}</p>
                    <p>위치: ${source} (${lineno}:${colno})</p>
                </div>
            `;
            return true;
        };

        const App = () => {
            return (
                <div className="flex items-center justify-center h-full bg-gray-100">
                    <h1 className="text-2xl font-bold">GY 아젠다 보드가 정상적으로 로드되었습니다.</h1>
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch (e) {
            document.getElementById('root').innerHTML = `<div class="error-boundary">렌더링 실패: ${e.message}</div>`;
        }
    </script>
</body>
</html>
