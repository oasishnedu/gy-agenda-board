<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원 다모임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script>
        // 1. 기존 파이어베이스 연결 설정 (선생님의 기존 환경 복구)
const firebaseConfig = {
  apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",
  authDomain: "gy-agenda-board.firebaseapp.com",
  projectId: "gy-agenda-board",
  storageBucket: "gy-agenda-board.firebasestorage.app",
  messagingSenderId: "636849502282",
  appId: "1:636849502282:web:b939a4a1c96a7b52098eb3"
};
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 2. 메인 앱 로직 (React.createElement 사용으로 오류 원천 차단)
        const { useState, useEffect } = React;

        function App() {
            const [agendas, setAgendas] = useState([]);

            useEffect(() => {
                const agendaRef = db.ref('agendas');
                agendaRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const list = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                        setAgendas(list);
                    }
                });
                return () => agendaRef.off();
            }, []);

            return React.createElement('div', { className: 'p-6 max-w-2xl mx-auto' },
                React.createElement('h1', { className: 'text-2xl font-bold mb-6 text-indigo-700' }, '구영초 교직원 다모임'),
                agendas.map(item => 
                    React.createElement('div', { key: item.id, className: 'bg-white p-4 rounded-lg shadow mb-3 border-l-4 border-indigo-500' },
                        React.createElement('h2', { className: 'font-bold text-lg' }, item.title),
                        React.createElement('p', { className: 'text-gray-600' }, item.description)
                    )
                )
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
