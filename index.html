    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<div style="padding:20px; text-align:center; margin-top:10vh; font-family:sans-serif;"><h2 style="color:#e11d48;">앗! 네트워크/데이터베이스 연결 실패 😭</h2><p style="color:#475569; margin-bottom: 20px;">데이터베이스(Firebase) 연결 과정에서 문제가 생겼습니다.<br/><b>아래 메시지를 복사해서 알려주세요!</b></p><div style="background:#f1f5f9; padding:20px; border-radius:12px; border: 1px solid #cbd5e1; text-align:left; display:inline-block; width:100%; max-width:600px; box-sizing:border-box; overflow-x:auto;"><pre style="color:#b91c1c; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; margin:0;">' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre></div></div>';
    });
  </script>

  <script type="text/babel" data-type="module" data-presets="react">
    /** @jsx React.createElement */

    const { useState, useEffect, useRef } = React;

    const myFirebaseConfig = {
      apiKey: "AIzaSyBUswpTXN7GZxUcR50yuieV5hJwaYGHrzQ",

    // 아이콘 컴포넌트들

    const XIcon = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
    const Trash2 = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>;
    const Lock = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
    const FileText = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>;
    const ChevronDown = ({ className }) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const MeetingIcon = ({ className }) => (
      <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
        <circle cx="9" cy="7" r="4"></circle>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>

    // 에러 렌더링 방어막
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen w-full flex flex-col items-center justify-center bg-slate-100 p-6 text-center">
              <div className="bg-white p-8 rounded-2xl shadow-xl max-w-lg w-full border border-red-200">
                <h1 className="text-2xl font-bold text-red-600 mb-4 flex items-center justify-center gap-2">
                  <XIcon className="w-8 h-8" /> 렌더링 오류 발생
                </h1>
                <p className="text-slate-600 mb-6 text-sm">데이터 구조가 변경되어 화면을 표시할 수 없습니다.</p>
                <pre className="bg-slate-50 p-4 rounded-lg text-xs text-left text-red-500 overflow-x-auto whitespace-pre-wrap">{this.state.error && this.state.error.toString()}</pre>
                <button onClick={() => window.location.reload()} className="mt-6 px-6 py-2.5 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 w-full">새로고침</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const RichEditor = ({ initialValue, onHTMLChange }) => {
      const editorRef = useRef(null);
      const [isMounted, setIsMounted] = useState(false);

      useEffect(() => {
        if (editorRef.current && !isMounted) {
          editorRef.current.innerHTML = initialValue || '';
          setIsMounted(true);
        }
      }, [initialValue, isMounted]);

      const execCmd = (cmd, val = null) => {
        document.execCommand(cmd, false, val);
        editorRef.current.focus();
        onHTMLChange(editorRef.current.innerHTML);
      };

      const insertSymbol = (e) => {
        const symbol = e.target.value;
        if(symbol) {
          document.execCommand('insertText', false, symbol);
          editorRef.current.focus();
          onHTMLChange(editorRef.current.innerHTML);
        }
      };

      const handleInput = () => onHTMLChange(editorRef.current.innerHTML);

      const colors = ['#0f172a', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
      const symbols = ['★', '☆', '♥', '♡', '💡', '📌', '✓', '➔', '📝', '※', '■', '□', '●', '○', '▶', '▷'];

      return (
        <div className="flex flex-col border-t border-indigo-100 bg-white">
          <div className="flex flex-wrap items-center gap-1 sm:gap-2 p-1.5 sm:p-2 bg-slate-50 border-b border-slate-200 rounded-t-sm">
            <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => execCmd('bold')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 font-bold text-slate-700" title="굵게">B</button>
            <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => execCmd('italic')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 italic font-serif text-slate-700" title="기울임">I</button>
            <button type="button" onMouseDown={e => e.preventDefault()} onClick={() => execCmd('underline')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 underline text-slate-700" title="밑줄">U</button>
            <div className="w-px h-5 bg-slate-300 mx-1"></div>
            <div className="flex gap-1.5">
              {colors.map(c => (
                <button key={c} type="button" onMouseDown={e => e.preventDefault()} onClick={() => execCmd('foreColor', c)} className="w-5 h-5 sm:w-6 sm:h-6 rounded-full border border-slate-300 hover:scale-110 transition-transform shadow-sm" style={{backgroundColor: c}} title="글자색 변경"></button>
              ))}
            </div>
            <div className="w-px h-5 bg-slate-300 mx-1"></div>
            <select value="" onChange={insertSymbol} className="p-1 text-xs sm:text-sm border border-slate-300 rounded focus:outline-none bg-white text-slate-700 cursor-pointer shadow-sm">
              <option value="" disabled>기호</option>
              {symbols.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div
            ref={editorRef}
            contentEditable
            onInput={handleInput}
            onBlur={handleInput}
            className="p-3 min-h-[150px] outline-none text-sm sm:text-base leading-relaxed"
            placeholder="여기에 다모임 내용을 자유롭게 작성하세요..."
          />
        </div>
      );
    };

    function App() {
      const [user, setUser] = useState(null);
      const [isAdmin, setIsAdmin] = useState(false);
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [adminPassword, setAdminPassword] = useState('');
      const [loginError, setLoginError] = useState(false);

      useEffect(() => {
        if (!auth) return;
        const initAuth = async () => {
          try {
            if (!isCustomFirebase && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("인증 오류:", e);
          }
        };
        initAuth();
        const unsubscribe = onAuthStateChanged(auth, setUser);
        return () => unsubscribe();
      }, []);

      const defaultPastNotes = [{ id: "1", content: "2월 다모임 결과 공유 (25.02.20)\n\n1. 새학년 교육과정 준비 주간 일정 확정\n- 2/24(월): 학년별 협의회 및 교실 정비\n- 2/25(화): 전 교직원 워크숍\n\n2. 예산 사용 관련 안내\n- 학급 운영비 배분 기준 합의 완료" }];
      const defaultAgendas = [
        { id: "1", title: '3월 학급 자치활동 운영 예산 지원 건', description: '학년별 예산 배분 및 사용 기준, 정산 방법에 대해 논의하고자 합니다.', author: '박교사', date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now() + 1000 },
        { id: "2", title: '학생 생활지도 규정 개정 및 안전 교육', description: '쉬는 시간 스마트폰 사용 규정 및 등하교 교통안전 지도 방안에 대한 의견 수렴이 필요합니다.', author: '최부장', date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now() }
      ];
      const defaultSchedule = { title: '3월 구영초 교직원 다모임', date: '2026-03-26T15:00', location: '우다다책숲 도서관', note: '' };

      const [pastNotes, setPastNotes] = useState(db ? [] : defaultPastNotes);
      const [showPastNotesModal, setShowPastNotesModal] = useState(false);
      const [isEditingPastNotes, setIsEditingPastNotes] = useState(false);
      const [editPastNotesForm, setEditPastNotesForm] = useState([]);
      const [expandedNoteId, setExpandedNoteId] = useState(null);

      const [agendas, setAgendas] = useState(db ? [] : defaultAgendas);
      const [newAgenda, setNewAgenda] = useState({ title: '', description: '', author: '' });
      const [editingAgendaId, setEditingAgendaId] = useState(null);
      const [editAgendaForm, setEditAgendaForm] = useState({ title: '', description: '', author: '' });

      const [schedule, setSchedule] = useState(db ? {} : defaultSchedule);
      const [isEditingSchedule, setIsEditingSchedule] = useState(false);
      const [editScheduleForm, setEditScheduleForm] = useState(schedule);

      useEffect(() => {
        if (!user || !db) return;

        const agendasRef = collection(db, 'artifacts', appId, 'public', 'data', 'agendas');
        const unsubAgendas = onSnapshot(agendasRef, (snapshot) => {
          try {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            data.sort((a, b) => b.createdAt - a.createdAt); 
            setAgendas(data || []);
          } catch(e) { console.error(e); }
        });

        const scheduleRef = collection(db, 'artifacts', appId, 'public', 'data', 'schedule');
        const unsubSchedule = onSnapshot(scheduleRef, (snapshot) => {
          try {
            const docSnap = snapshot.docs.find(d => d.id === 'current');
            if (docSnap && docSnap.exists()) {
              setSchedule(docSnap.data() || defaultSchedule);
            } else {
              setSchedule(defaultSchedule); 
            }
          } catch(e) { console.error(e); }
        });

        const notesRef = collection(db, 'artifacts', appId, 'public', 'data', 'pastNotes');
        const unsubNotes = onSnapshot(notesRef, (snapshot) => {
          try {
            const docSnap = snapshot.docs.find(d => d.id === 'all');
            if (docSnap && docSnap.exists() && docSnap.data().notes) {
              if (Array.isArray(docSnap.data().notes)) {
                setPastNotes(docSnap.data().notes);
              }
            } else {
              setPastNotes(defaultPastNotes); 
            }
          } catch(e) { console.error("회의록 동기화 에러:", e); }
        });

        return () => { unsubAgendas(); unsubSchedule(); unsubNotes(); };
      }, [user]);

      const formatDateTime = (dateStr) => {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
        const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
        let hours = d.getHours();
        const minutes = String(d.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? '오후' : '오전';
        hours = hours % 12;
        hours = hours ? hours : 12; 
        return `${year}년 ${month}월 ${day}일 (${week}) ${ampm} ${hours}:${minutes}`;
      };

      const getDDay = (dateStr) => {
        if (!dateStr) return null;
        const targetDate = new Date(dateStr);
        if (isNaN(targetDate.getTime())) return null;
        const today = new Date();
        targetDate.setHours(0, 0, 0, 0); today.setHours(0, 0, 0, 0); 
        const diff = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'D-Day';
        if (diff > 0) return `D-${diff}`;
        return `D+${Math.abs(diff)}`;
      };
      
      const dDayString = schedule && schedule.date ? getDDay(schedule.date) : null;

      const [currentTime, setCurrentTime] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 60000);
        return () => clearInterval(timer);
      }, []);
      const isRegistrationOpen = schedule && schedule.date && currentTime < new Date(schedule.date);

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPassword === '3500') { 
          setIsAdmin(true); setShowAdminModal(false); setAdminPassword(''); setLoginError(false);
        } else {
          setLoginError(true);
        }
      };

      const handleOpenPastNotes = () => {
        setIsEditingPastNotes(false);
        setShowPastNotesModal(true);
        if (pastNotes && pastNotes.length > 0) setExpandedNoteId(pastNotes[0].id);
      };

      const convertToSafeForm = (notesArray) => {
        if (!Array.isArray(notesArray)) return [];
        return notesArray.map(n => {
          if (n && n.title !== undefined) return { ...n }; 
          const safeContent = n && n.content ? String(n.content).trim() : '';
          const lines = safeContent.split('\n');
          return { id: n ? n.id : Date.now().toString(), title: lines[0] || '', content: lines.slice(1).join('<br/>').trim(), isHtml: true };
        });
      };

      const handleStartEdit = () => {
        try {

                <div className="p-2.5 sm:p-3 flex flex-col gap-2.5 sm:gap-3 lg:flex-1 lg:overflow-y-auto bg-slate-50/30">
                  {(!agendas || agendas.length === 0) ? (
                    <div className="py-6 sm:py-8 flex flex-col items-center justify-center text-slate-400 gap-1.5 sm:gap-2">
                      <MessageSquare className="w-8 h-8 opacity-20" /><p className="text-[10px] sm:text-xs text-center">아직 등록된 안건이 없습니다.<br/>첫 번째 안건을 등록해 보세요!</p>
                    </div>
                  ) : (
                    agendas.map((agenda) => (
                      editingAgendaId === agenda.id ? (
                        <div key={`edit-${agenda.id}`} className="bg-indigo-50/50 p-2.5 sm:p-3 rounded-lg border border-indigo-200 flex flex-col gap-2">
                          <div className="flex items-center justify-between mb-0.5"><h3 className="text-[10px] sm:text-xs font-bold text-indigo-700 flex items-center gap-1"><Edit2 className="w-3 h-3"/> 안건 수정 중</h3><button onClick={handleCancelAgendaEdit} className="p-1 text-slate-500 hover:bg-slate-200 rounded-md transition-colors"><XIcon className="w-3 h-3" /></button></div>
                          <input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.author || ''} onChange={(e) => setEditAgendaForm({...editAgendaForm, author: e.target.value})} placeholder="등록자" />
                          <input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.title || ''} onChange={(e) => setEditAgendaForm({...editAgendaForm, title: e.target.value})} placeholder="안건 제목" />
                          <textarea className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm resize-none min-h-[60px] focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.description || ''} onChange={(e) => setEditAgendaForm({...editAgendaForm, description: e.target.value})} placeholder="상세 내용"></textarea>
                          <div className="flex justify-end mt-1"><button onClick={handleSaveAgendaEdit} className="flex items-center gap-1 px-2.5 sm:px-3 py-1 sm:py-1.5 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 transition-colors text-[10px] sm:text-xs"><Save className="w-3 h-3" /> 저장완료</button></div>
                        </div>
                      ) : (
                        <div key={agenda.id} className="bg-white p-2.5 sm:p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow group relative">
                          <div className="flex justify-between items-start mb-1 pr-14 sm:pr-16"><h3 className="text-xs sm:text-sm font-bold text-slate-800 leading-tight">{agenda.title}</h3></div>
                          <div className="absolute top-2.5 right-2.5 flex flex-col items-end gap-0.5 sm:gap-1">
                            {(isRegistrationOpen || isAdmin) && (
                              <div className="opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex gap-0.5 bg-white/90 rounded px-1 pb-1">
                                <button onClick={() => handleEditAgendaClick(agenda)} className="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded" title="수정"><Edit2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" /></button>
                                <button onClick={() => handleDeleteAgenda(agenda.id)} className="p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded" title="삭제"><Trash2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" /></button>
                              </div>
                            )}
                          </div>
                          {agenda.description && <p className="text-slate-600 text-[10px] sm:text-xs mt-1.5 mb-2 whitespace-pre-wrap leading-relaxed">{agenda.description}</p>}
                          <div className="flex items-center gap-1 sm:gap-1.5 mt-2 pt-2 border-t border-slate-50"><div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600"><User className="w-2.5 h-2.5 sm:w-3 sm:h-3" /></div><span className="text-[10px] sm:text-xs font-medium text-slate-700">{agenda.author}</span></div>
                        </div>
                      )
                    ))
                  )}
                </div>
              </section>
            </main>

            <footer className="py-2.5 sm:py-3 bg-slate-100 border-t border-slate-200 flex justify-center items-center flex-shrink-0 z-10 relative">
              <span className="text-[10px] sm:text-xs text-slate-400 font-medium tracking-wide">&copy; 2026 GUYOUNG ELEMENTARY SCHOOL</span>
              {!isAdmin ? (
                <button onClick={() => setShowAdminModal(true)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-slate-300 hover:text-indigo-400 font-medium transition-colors">관리자</button>
              ) : (
                <button onClick={() => setIsAdmin(false)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-indigo-500 hover:text-indigo-700 font-bold transition-colors">모드 종료</button>
              )}
            </footer>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
