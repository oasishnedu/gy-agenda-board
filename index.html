<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구영초 교직원다모임</title>
    <!-- 외부 CDN 설정: 최적화된 로딩 순서 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-200">
    <div id="root"></div>

    <script>
        // 코드 실행 안전 가드: React가 로드된 후 실행
        const { useState, useEffect } = React;
        const { Calendar, PlusCircle, List, User, Clock, MessageSquare, Edit2, Save, X, Trash2, Lock } = lucide;

        function App() {
            const [agendas, setAgendas] = useState([
                { id: 1, title: '3월 학급 자치활동 운영 예산 지원 건', description: '학년별 예산 배분 및 사용 기준 논의', author: '박교사', date: '2026-06-22' },
                { id: 2, title: '학생 생활지도 규정 개정', description: '스마트폰 사용 규정 의견 수렴', author: '최부장', date: '2026-06-22' }
            ]);

            return React.createElement('div', { className: 'min-h-screen w-full bg-slate-200 flex justify-center items-center p-4' },
                React.createElement('div', { className: 'w-[400px] bg-white rounded-2xl shadow-xl p-6' },
                    React.createElement('h1', { className: 'text-xl font-bold text-indigo-600 mb-4' }, '구영초 교직원다모임'),
                    agendas.map(agenda => 
                        React.createElement('div', { key: agenda.id, className: 'mb-4 p-3 border rounded' },
                            React.createElement('h2', { className: 'font-bold' }, agenda.title),
                            React.createElement('p', { className: 'text-sm text-gray-600' }, agenda.description)
                        )
                    )
                )
            );
        }

        // 렌더링 로직
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
