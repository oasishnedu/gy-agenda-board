    // --- 🌟 신규: 웹 에디터(Rich Text) 컴포넌트 ---
    const RichEditor = ({ initialValue, onHTMLChange }) => {
      const editorRef = React.useRef(null);
      const [isMounted, setIsMounted] = useState(false);

      useEffect(() => {
        if (editorRef.current && !isMounted) {
          editorRef.current.innerHTML = initialValue || '';
          setIsMounted(true);
        }
      }, [initialValue, isMounted]);

      const execCmd = (cmd, val = null) => {
        editorRef.current.focus();
        document.execCommand(cmd, false, val);
        onHTMLChange(editorRef.current.innerHTML);
      };

      const insertSymbol = (symbol) => {
        editorRef.current.focus();
        document.execCommand('insertText', false, symbol);
        onHTMLChange(editorRef.current.innerHTML);
      };

      const handleInput = () => {
        onHTMLChange(editorRef.current.innerHTML);
      };

      const colors = ['#0f172a', '#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];
      const symbols = ['★', '☆', '♥', '♡', '💡', '📌', '✓', '➔', '📝', '※', '■', '□', '●', '○', '▶', '▷'];

      return (
        <div className="flex flex-col border-t border-indigo-100 bg-white">
          <div className="flex flex-wrap items-center gap-1 sm:gap-2 p-1.5 sm:p-2 bg-slate-50 border-b border-slate-200 rounded-t-sm">
            <button type="button" onClick={() => execCmd('bold')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 font-bold text-slate-700" title="굵게">B</button>
            <button type="button" onClick={() => execCmd('italic')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 italic font-serif text-slate-700" title="기울임">I</button>
            <button type="button" onClick={() => execCmd('underline')} className="w-7 h-7 sm:w-8 sm:h-8 flex justify-center items-center rounded hover:bg-slate-200 underline text-slate-700" title="밑줄">U</button>
            <div className="w-px h-5 bg-slate-300 mx-1"></div>
            <div className="flex gap-1.5">
              {colors.map(c => (
                <button key={c} type="button" onClick={() => execCmd('foreColor', c)} className="w-5 h-5 sm:w-6 sm:h-6 rounded-full border border-slate-300 hover:scale-110 transition-transform shadow-sm" style={{backgroundColor: c}} title="글자색 변경"></button>
              ))}
            </div>
            <div className="w-px h-5 bg-slate-300 mx-1"></div>
            <select onChange={(e) => { if(e.target.value) insertSymbol(e.target.value); e.target.value=''; }} className="p-1 text-xs sm:text-sm border border-slate-300 rounded focus:outline-none bg-white text-slate-700 cursor-pointer shadow-sm">
              <option value="">특수기호</option>
              {symbols.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div
            ref={editorRef}
            contentEditable
            onInput={handleInput}
            onBlur={handleInput}
            className="p-3 min-h-[150px] outline-none text-sm sm:text-base leading-relaxed"
            placeholder="여기에 다모임 내용을 자유롭게 작성하세요..."
          />
        </div>
      );

try {
// 🌟 수정됨: 선생님의 커스텀 파이어베이스 환경에서는 캔버스용 토큰을 사용하면 에러(token-mismatch)가 나므로 분기 처리합니다.
if (!isCustomFirebase && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
await signInWithCustomToken(auth, __initial_auth_token);
} else {
// Vercel(선생님 개인 파이어베이스) 환경에서는 익명 로그인 사용

}
} catch (e) {

const agendasRef = collection(db, 'artifacts', appId, 'public', 'data', 'agendas');
const unsubAgendas = onSnapshot(agendasRef, (snapshot) => {
const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

setAgendas(data);
}, (err) => console.error("안건 연동 에러:", err));

if (docSnap && docSnap.exists()) {
setSchedule(docSnap.data());
} else {
setSchedule(defaultSchedule); // DB가 비어있으면 로컬 화면에만 기본값 표시

}, (err) => console.error("일정 연동 에러:", err));

const docSnap = snapshot.docs.find(d => d.id === 'all');

setPastNotes(docSnap.data().notes);
} else {
setPastNotes(defaultPastNotes); // DB가 비어있으면 로컬 화면에만 기본값 표시
}
}, (err) => console.error("회의록 연동 에러:", err));

return () => { unsubAgendas(); unsubSchedule(); unsubNotes(); };

if (isNaN(d.getTime())) return dateStr;
const year = d.getFullYear(), month = d.getMonth() + 1, day = d.getDate();
const week = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
let hours = d.getHours();
const minutes = String(d.getMinutes()).padStart(2, '0');
const ampm = hours >= 12 ? '오후' : '오전';
hours = hours % 12;
hours = hours ? hours : 12; 
return `${year}년 ${month}월 ${day}일 (${week}) ${ampm} ${hours}:${minutes}`;
};

const getDDay = (dateStr) => {
if (!dateStr) return null;
const targetDate = new Date(dateStr);
if (isNaN(targetDate.getTime())) return null;
const today = new Date();
targetDate.setHours(0, 0, 0, 0); today.setHours(0, 0, 0, 0); 
const diff = Math.round((targetDate - today) / (1000 * 60 * 60 * 24));
if (diff === 0) return 'D-Day';
if (diff > 0) return `D-${diff}`;
return `D+${Math.abs(diff)}`;
};

// Cloudinary에 파일 하나를 업로드하고 결과를 반환하는 함수
const uploadFileToCloudinary = async (file) => {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  formData.append('folder', 'gy-agenda-board');

  // 이미지 파일인지 판단
  const isImage = file.type.startsWith('image/');
  // 이미지가 아닌 경우(PDF, 문서 등)는 raw 리소스 타입으로 업로드
  const resourceType = isImage ? 'image' : 'raw';

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,
    { method: 'POST', body: formData }
  );
  if (!res.ok) throw new Error(`업로드 실패: ${file.name}`);
  const data = await res.json();
  return {
    name: file.name,
    url: data.secure_url,
    type: file.type,
    size: file.size,
    isImage,
  };
};

</span>
</div>

<div className="p-2.5 sm:p-3 flex flex-col gap-2.5 sm:gap-3 lg:flex-1 lg:overflow-y-auto bg-slate-50/30">
{agendas.length === 0 ? (
<div className="py-6 sm:py-8 flex flex-col items-center justify-center text-slate-400 gap-1.5 sm:gap-2">
<MessageSquare className="w-8 h-8 opacity-20" />
<p className="text-[10px] sm:text-xs text-center">아직 등록된 안건이 없습니다.<br/>첫 번째 안건을 등록해 보세요!</p>
</div>
) : (
agendas.map((agenda) => (
editingAgendaId === agenda.id ? (
<div key={`edit-${agenda.id}`} className="bg-indigo-50/50 p-2.5 sm:p-3 rounded-lg border border-indigo-200 flex flex-col gap-2">
<div className="flex items-center justify-between mb-0.5">
<h3 className="text-[10px] sm:text-xs font-bold text-indigo-700 flex items-center gap-1">
<Edit2 className="w-3 h-3"/> 안건 수정 중
</h3>
<button onClick={handleCancelAgendaEdit} className="p-1 text-slate-500 hover:bg-slate-200 rounded-md transition-colors">
<XIcon className="w-3 h-3" />
</button>
</div>
<input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.author} onChange={(e) => setEditAgendaForm({...editAgendaForm, author: e.target.value})} placeholder="등록자" />
<input type="text" className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.title} onChange={(e) => setEditAgendaForm({...editAgendaForm, title: e.target.value})} placeholder="안건 제목" />
<textarea className="w-full px-2 py-1.5 rounded-md border border-indigo-200 text-xs sm:text-sm resize-none min-h-[60px] focus:outline-none focus:ring-1 focus:ring-indigo-500" value={editAgendaForm.description} onChange={(e) => setEditAgendaForm({...editAgendaForm, description: e.target.value})} placeholder="상세 내용"></textarea>

{/* 📎 기존 첨부파일 관리 */}
{editAgendaForm.attachments && editAgendaForm.attachments.length > 0 && (
  <div className="flex flex-col gap-1">
    <p className="text-[10px] text-slate-500 font-medium">첨부파일</p>
    {editAgendaForm.attachments.map((file, idx) => (
      <div key={idx} className="flex items-center gap-1.5 bg-white border border-slate-200 rounded px-2 py-1">
        {file.isImage
          ? <Image className="w-3 h-3 text-indigo-400 flex-shrink-0" />
          : <FileText className="w-3 h-3 text-indigo-400 flex-shrink-0" />}
        <span className="text-[10px] text-slate-600 flex-1 truncate">{file.name}</span>
        <button
          type="button"
          onClick={() => setEditAgendaForm({...editAgendaForm, attachments: editAgendaForm.attachments.filter((_, i) => i !== idx)})}
          className="p-0.5 text-slate-300 hover:text-red-500 transition-colors flex-shrink-0"
          title="첨부파일 삭제"
        >
          <XIcon className="w-3 h-3" />
        </button>
      </div>
    ))}
  </div>
)}

{/* 📎 새 파일 추가 */}
<label className="flex items-center gap-1.5 px-2 py-1.5 border border-dashed border-indigo-200 rounded-md cursor-pointer hover:bg-indigo-50 transition-colors text-indigo-400 hover:text-indigo-600">
  <Paperclip className="w-3 h-3 flex-shrink-0" />
  <span className="text-[10px]">새 파일 추가 (최대 10MB)</span>
  <input type="file" multiple accept="image/*,.pdf,.doc,.docx,.hwp,.hwpx,.ppt,.pptx,.xls,.xlsx" className="hidden"
    onChange={(e) => {
      const files = Array.from(e.target.files).filter(f => {
        if (f.size > 10 * 1024 * 1024) { alert(`"${f.name}"은 10MB 초과입니다.`); return false; }
        return true;
      });
      if (files.length > 0) {
        setPendingFiles(files);
        setPendingTarget('edit'); // 수정 폼용임을 표시
        setShowPrivacyWarning(true);
      }
      e.target.value = '';
    }}
  />
</label>

<div className="flex justify-end mt-1">
<button onClick={handleSaveAgendaEdit} className="flex items-center gap-1 px-2.5 sm:px-3 py-1 sm:py-1.5 bg-indigo-600 text-white font-medium rounded-md hover:bg-indigo-700 transition-colors text-[10px] sm:text-xs">
<Save className="w-3 h-3" />
저장완료
</button>
</div>
</div>
) : (
<div key={agenda.id} className="bg-white p-2.5 sm:p-3 rounded-lg border border-slate-200 shadow-sm hover:shadow-md transition-shadow group relative">
<div className="flex justify-between items-start mb-1 pr-14 sm:pr-16">
<h3 className="text-xs sm:text-sm font-bold text-slate-800 leading-tight">
{agenda.title}
</h3>
</div>

{/* 등록 기간 중에는 모든 사용자가, 마감 후에는 관리자만 수정/삭제 가능 */}
<div className="absolute top-2.5 right-2.5 flex flex-col items-end gap-0.5 sm:gap-1">
{(isRegistrationOpen || isAdmin) && (
<div className="opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity flex gap-0.5 bg-white/90 rounded px-1 pb-1">
<button onClick={() => handleEditAgendaClick(agenda)} className="p-1 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded" title="수정">
<Edit2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
</button>
<button onClick={() => handleDeleteAgenda(agenda.id)} className="p-1 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded" title="삭제">
<Trash2 className="w-3 h-3 sm:w-3.5 sm:h-3.5" />
</button>
</div>
)}
</div>

{agenda.description && (
<p className="text-slate-600 text-[10px] sm:text-xs mt-1.5 mb-2 whitespace-pre-wrap leading-relaxed">
{agenda.description}
</p>
)}

{/* 📎 첨부파일 표시 */}
{agenda.attachments && agenda.attachments.length > 0 && (
  <div className="mt-1.5 mb-2 flex flex-col gap-1">
    {agenda.attachments.map((file, idx) => (
      file.isImage ? (
        // 이미지 파일: 썸네일 미리보기
        <a key={idx} href={file.url} target="_blank" rel="noopener noreferrer" className="block group">
          <div className="relative rounded-md overflow-hidden border border-slate-200 bg-slate-100" style={{maxHeight: '120px'}}>
            <img src={file.url} alt={file.name} className="w-full object-cover" style={{maxHeight: '120px'}} />
            <div className="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors flex items-center justify-center">
              <Download className="w-5 h-5 text-white opacity-0 group-hover:opacity-100 transition-opacity" />
            </div>
          </div>
          <p className="text-[10px] text-slate-400 mt-0.5 truncate">{file.name}</p>
        </a>
      ) : (
        // 문서 파일: 다운로드 링크
        <a key={idx} href={file.url} target="_blank" rel="noopener noreferrer"
          className="flex items-center gap-1.5 px-2 py-1.5 bg-slate-50 border border-slate-200 rounded-md hover:bg-indigo-50 hover:border-indigo-200 transition-colors group">
          <FileText className="w-3 h-3 text-indigo-400 flex-shrink-0" />
          <span className="text-[10px] sm:text-xs text-slate-600 group-hover:text-indigo-700 flex-1 truncate">{file.name}</span>
          <Download className="w-3 h-3 text-slate-300 group-hover:text-indigo-500 flex-shrink-0" />
        </a>
      )
    ))}
  </div>
)}

<div className="flex items-center gap-1 sm:gap-1.5 mt-2 pt-2 border-t border-slate-50">
<div className="w-4 h-4 sm:w-5 sm:h-5 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600">
<User className="w-2.5 h-2.5 sm:w-3 sm:h-3" />
</div>
<span className="text-[10px] sm:text-xs font-medium text-slate-700">{agenda.author}</span>
{agenda.attachments && agenda.attachments.length > 0 && (
  <span className="ml-auto flex items-center gap-0.5 text-[10px] text-slate-400">
    <Paperclip className="w-2.5 h-2.5" />{agenda.attachments.length}
  </span>
)}
</div>
</div>
)
))
)}
</div>
</section>

</main>

{/* 하단 저작권 및 관리자 메뉴 버튼 */}
<footer className="py-2.5 sm:py-3 bg-slate-100 border-t border-slate-200 flex justify-center items-center flex-shrink-0 z-10 relative">
<span className="text-[10px] sm:text-xs text-slate-400 font-medium tracking-wide">
&copy; 2026 GUYOUNG ELEMENTARY SCHOOL
</span>

{!isAdmin ? (
<button onClick={() => setShowAdminModal(true)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-slate-300 hover:text-indigo-400 font-medium transition-colors">
관리자
</button>
) : (
<button onClick={() => setIsAdmin(false)} className="absolute right-4 sm:right-6 text-[10px] sm:text-xs text-indigo-500 hover:text-indigo-700 font-bold transition-colors">
모드 종료
</button>
)}
</footer>

</div>
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
